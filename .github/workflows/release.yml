name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION)"

      - name: Sync VERSION file
        run: echo "${{ steps.meta.outputs.version }}" > VERSION

      - name: Build .deb packages
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: sh build_deb.sh --deb-only

      - name: Write checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ShellGuard ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/SHA256SUMS
          fail_on_unmatched_files: true
